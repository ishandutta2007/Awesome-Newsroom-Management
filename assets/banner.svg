<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="350">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <style>
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.4); opacity: 1; }
      }
      @keyframes floatLine {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -40; }
      }
      @keyframes glowText {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; filter: drop-shadow(0 0 10px rgba(129, 140, 248, 0.6)); }
      }
      .node { animation: pulseNode 4s infinite ease-in-out; transform-origin: center; }
      .node-delay1 { animation-delay: 1s; }
      .node-delay2 { animation-delay: 2s; }
      .node-delay3 { animation-delay: 3s; }
      .data-line { stroke: #6366f1; stroke-dasharray: 6 6; animation: floatLine 3s linear infinite; opacity: 0.4; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; fill: #cbd5e1; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; fill: #38bdf8; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Geometric Grid & Waves -->
  <g opacity="0.25">
    <circle cx="1000" cy="80" r="240" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 8" />
    <circle cx="1000" cy="80" r="160" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <path d="M 0 280 Q 300 200 600 280 T 1200 240" fill="none" stroke="url(#accentGrad)" stroke-width="2" />
    <path d="M 0 300 Q 400 230 800 310 T 1200 270" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
  </g>

  <!-- Connecting Network Lines -->
  <line x1="850" y1="120" x2="980" y2="70" class="data-line" />
  <line x1="980" y1="70" x2="1080" y2="160" class="data-line" />
  <line x1="980" y1="70" x2="940" y2="240" class="data-line" />
  <line x1="1080" y1="160" x2="940" y2="240" class="data-line" />

  <!-- Pulsing Network Nodes (Newsroom Connection Hubs) -->
  <circle cx="850" cy="120" r="6" fill="#38bdf8" class="node node-delay1" />
  <circle cx="980" cy="70" r="9" fill="#818cf8" class="node node-delay2" />
  <circle cx="1080" cy="160" r="7" fill="#c084fc" class="node node-delay3" />
  <circle cx="940" cy="240" r="8" fill="#38bdf8" class="node" />

  <!-- Glassmorphism Card Overlay Behind Text for High Contrast -->
  <rect x="60" y="45" r="720" height="260" fill="url(#cardGrad)" rx="16" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <!-- Content Elements -->
  <!-- Top Tag / Category -->
  <g transform="translate(95, 85)">
    <rect x="0" y="0" width="220" height="28" fill="#0f172a" rx="14" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="110" y="18" text-anchor="middle" class="badge-text">📰 CURATED ECOSYSTEM</text>
  </g>

  <!-- Title -->
  <text x="95" y="160" class="title-text" font-size="44">Awesome Newsroom Management</text>

  <!-- Accent Line under Title -->
  <rect x="95" y="178" width="180" height="5" fill="url(#accentGrad)" rx="2.5" />

  <!-- Subtitle -->
  <text x="95" y="225" class="subtitle-text" font-size="20">
    <tspan x="95" dy="0">Enterprise NRCS, Editorial Workflows, Broadcast Rundowns,</tspan>
    <tspan x="95" dy="28">Content Production &amp; Multi-Platform News Delivery</tspan>
  </text>

  <!-- Highlight Pill Icons -->
  <g transform="translate(95, 275)" opacity="0.9">
    <!-- Item 1 -->
    <rect x="0" y="0" width="115" height="24" fill="#ffffff" fill-opacity="0.08" rx="6" />
    <text x="57" y="16" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">📺 NRCS Systems</text>
    
    <!-- Item 2 -->
    <rect x="125" y="0" width="125" height="24" fill="#ffffff" fill-opacity="0.08" rx="6" />
    <text x="187" y="16" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">📝 Story Scripting</text>

    <!-- Item 3 -->
    <rect x="260" y="0" width="125" height="24" fill="#ffffff" fill-opacity="0.08" rx="6" />
    <text x="322" y="16" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">⚡ Open Source</text>
  </g>
</svg>
