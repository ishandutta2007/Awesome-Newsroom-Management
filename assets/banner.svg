<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="350" viewBox="0 0 1200 350"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><style>@keyframes pulseNode{0%{transform:scale(1);opacity:.6}50%{transform:scale(1.4);opacity:1}}@keyframes floatLine{0%{stroke-dashoffset:0}}@keyframes glowText{0%{opacity:.9}50%{opacity:1;filter:drop-shadow(0 0 10px rgba(129,140,248,.6))}}.node{animation:pulseNode 4s infinite ease-in-out;transform-origin:center}.node-delay1{animation-delay:1s}.node-delay2{animation-delay:2s}.node-delay3{animation-delay:3s}.data-line{stroke:#6366f1;stroke-dasharray:6 6;animation:floatLine 3s linear infinite;opacity:.4}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;fill:#fff}.subtitle-text{font-weight:400;fill:#cbd5e1}.badge-text{font-weight:600;fill:#38bdf8;font-size:13px;letter-spacing:1.5px;text-transform:uppercase}</style></defs><rect width="1200" height="350" fill="url(#bgGrad)" rx="16"/><g opacity=".25"><circle cx="1000" cy="80" r="240" fill="none" stroke="#818cf8" stroke-dasharray="4 8" stroke-width="1"/><circle cx="1000" cy="80" r="160" fill="none" stroke="#c084fc" stroke-width="1.5"/><path fill="none" stroke="url(#accentGrad)" stroke-width="2" d="M 0 280 Q 300 200 600 280 T 1200 240"/><path fill="none" stroke="#38bdf8" stroke-width="1" d="M 0 300 Q 400 230 800 310 T 1